name: 'publish'

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (M1 and later)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # AppImage, deb, rpm
            args: ''
          - platform: 'windows-latest' # NSIS .exe, MSI
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Wayland client libs must come from the host system: bundling Ubuntu's
      # copies into the AppImage breaks EGL init on hosts with newer Mesa
      # ("Could not create default EGL display: EGL_BAD_PARAMETER").
      # Tauri reuses a cached linuxdeploy-plugin-gtk.sh, so pre-seed a patched
      # copy that strips those libs from the AppDir before packaging.
      - name: patch AppImage bundling to exclude wayland libs (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p ~/.cache/tauri
          PLUGIN=~/.cache/tauri/linuxdeploy-plugin-gtk.sh
          curl -fsSL -o "$PLUGIN" https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh \
            || curl -fsSL -o "$PLUGIN" https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          {
            echo ''
            echo '# blocks: strip bundled wayland libs; they must match the host or EGL fails'
            echo 'if [ -n "$APPDIR" ]; then rm -f "$APPDIR"/usr/lib/libwayland-*.so* || true; fi'
          } >> "$PLUGIN"
          chmod +x "$PLUGIN"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: blocks-v__VERSION__
          releaseName: 'Blocks v__VERSION__'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
